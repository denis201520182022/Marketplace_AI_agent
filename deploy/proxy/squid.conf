# Squid Proxy Configuration for AI for Salers
# Used on overseas VPS (JustHost / Timeweb overseas) to forward Telegram Bot API and OpenAI traffic

# Port
http_port 3128

# Basic authentication
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwords
auth_param basic realm Proxy Authentication Required
auth_param basic credentialsttl 2 hours
acl authenticated proxy_auth REQUIRED

# ACLs
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl CONNECT method CONNECT

# Whitelist allowed destinations for strict security
acl allowed_domains dstdomain .telegram.org
acl allowed_domains dstdomain .api.telegram.org
acl allowed_domains dstdomain .openai.com
acl allowed_domains dstdomain .api.openai.com
acl allowed_domains dstdomain .langfuse.com

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow authenticated allowed_domains
http_access deny all

# Hide client IP (anonymize)
forwarded_for off
request_header_access From deny all
request_header_access Server deny all
request_header_access WWW-Authenticate deny all
request_header_access Link deny all

# Logging
access_log /var/log/squid/access.log squid
